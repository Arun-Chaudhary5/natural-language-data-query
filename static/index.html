<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Data | AI Query</title>
    <meta name="description" content="Talk to your database using natural language.">
    <!-- Modern Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/index.css">
</head>
<body>
    <div class="grid-overlay"></div>

    <div class="app-container">
        <header>
            <div class="brand">
                <h1>Nexus <span>AI</span></h1>
                <p>Natural Language Database Interface</p>
            </div>
        </header>

        <main>
            <div class="chat-container" id="chatContainer">
                <div class="message system-message">
                    Welcome to Nexus. Formulate your data inquiries using natural human language.
                </div>
            </div>

            <form id="queryForm" class="input-container">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Ask about revenue, customers, or orders..." 
                    autocomplete="off"
                    required
                >
                <button type="submit" id="sendBtn" title="Send Query">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
            
            <div class="actions-container">
                <button id="clearBtn" class="secondary-btn" title="Clear Conversation Context">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Wipe Memory
                </button>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
